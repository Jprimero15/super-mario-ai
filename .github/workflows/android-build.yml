name: Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Build everything inside the requested Arch Linux image. The image is
# responsible for the base OS; the workflow installs the Android/JVM tooling
# needed by this Gradle project so builds remain reproducible.
container:
  image: jprimero15/archlinux-docker:latest

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.7"
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git nodejs npm curl unzip zip jdk17-openjdk
          java -version
          node --version

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /opt/gradle
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          ln -sf "/opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle
          gradle --version

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          gradle --no-daemon --stacktrace --warning-mode all android:assembleDebug

      - name: Verify LibGDX native libraries are packaged
        shell: bash
        run: |
          set -euxo pipefail
          APK="android/build/outputs/apk/debug/android-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libgdx\.so$'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-mario-game-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
