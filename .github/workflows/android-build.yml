name: Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_SDK_VERSION: "9.0.318"
  DOTNET_RUNTIME_VERSION: "8.0.30"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_NDK: "28.1.13356709"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Pin .NET SDK selection
        shell: bash
        run: |
          set -euxo pipefail
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.318",
              "rollForward": "latestPatch",
              "allowPrerelease": false
            }
          }
          EOF
          dotnet --version
          test "$(dotnet --version)" = "9.0.318"

      - name: Install isolated .NET 8 runtime for Godot
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          rm -rf /opt/dotnet8
          sudo mkdir -p /opt/dotnet8
          sudo /tmp/dotnet-install.sh \
            --runtime dotnet \
            --version "${DOTNET_RUNTIME_VERSION}" \
            --install-dir /opt/dotnet8 \
            --no-path
          test -x /opt/dotnet8/dotnet
          /opt/dotnet8/dotnet --list-runtimes

      - name: Verify isolated Godot runtime
        shell: bash
        run: |
          set -euxo pipefail
          DOTNET_ROOT=/opt/dotnet8 DOTNET_MULTILEVEL_LOOKUP=0 /opt/dotnet8/dotnet --list-runtimes
          test -d /opt/dotnet8/shared/Microsoft.NETCore.App/8.0.30

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}"

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/android"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -o /tmp/godot.zip
          rm -rf /tmp/godot /opt/godot
          mkdir -p /tmp/godot /opt/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v*-stable_mono_linux.x86_64' -print -quit)"
          GODOT_SHARP="$(find /tmp/godot -type d -name 'GodotSharp' -print -quit)"
          if [ -z "$GODOT_BIN" ] || [ -z "$GODOT_SHARP" ]; then
            echo "ERROR: Godot .NET runtime files not found in archive"
            find /tmp/godot -maxdepth 4 -print
            exit 1
          fi

          GODOT_ROOT="$(dirname "$GODOT_SHARP")"
          sudo cp -a "$GODOT_ROOT/." /opt/godot/
          sudo chmod +x "$(find /opt/godot -type f -name 'Godot_v*-stable_mono_linux.x86_64' -print -quit)"
          sudo ln -sfn "$(find /opt/godot -type d -name GodotSharp -print -quit)" /usr/local/bin/GodotSharp
          INSTALLED_BIN="$(find /opt/godot -type f -name 'Godot_v*-stable_mono_linux.x86_64' -print -quit)"
          sudo ln -sfn "$INSTALLED_BIN" /usr/local/bin/godot

          test -d /usr/local/bin/GodotSharp/Api/Debug
          test -f /usr/local/bin/GodotSharp/Api/Debug/GodotSharp.dll
          godot --version

      - name: Install matching .NET export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Clean generated Godot C# cache
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .godot/mono .godot/editor
          mkdir -p .godot/mono

      - name: Generate Godot C# solution
        shell: bash
        env:
          DOTNET_ROOT: /opt/dotnet8
          DOTNET_MULTILEVEL_LOOKUP: "0"
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          test -f super-mario-ai.sln
          test -f super-mario-ai.csproj

      - name: Restore C# dependencies
        run: dotnet restore super-mario-ai.sln

      - name: Build C# solution
        run: dotnet build super-mario-ai.sln --configuration Debug --no-restore --no-incremental

      - name: Verify C# assembly
        shell: bash
        run: |
          set -euxo pipefail
          test -s .godot/mono/temp/bin/Debug/super-mario-ai.dll
          echo "SDK: $(dotnet --version)"
          echo "Built assembly:"
          ls -lah .godot/mono/temp/bin/Debug/

      - name: Verify Godot can load the rebuilt C# assembly
        shell: bash
        env:
          DOTNET_ROOT: /opt/dotnet8
          DOTNET_MULTILEVEL_LOOKUP: "0"
        run: |
          set -euxo pipefail
          /opt/dotnet8/dotnet --list-runtimes
          godot --headless --path . --editor --quit --verbose

      - name: Run Godot C# smoke test
        shell: bash
        env:
          DOTNET_ROOT: /opt/dotnet8
          DOTNET_MULTILEVEL_LOOKUP: "0"
        run: |
          set -euxo pipefail
          godot --headless --path . --script tests/smoke_test_v2.gd

      - name: Export signed Android debug APK
        shell: bash
        env:
          DOTNET_ROOT: /opt/dotnet8
          DOTNET_MULTILEVEL_LOOKUP: "0"
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -f "$TEMPLATE_DIR/android_source.zip"
          mkdir -p build/android
          godot --headless --path . --install-android-build-template --export-debug "Android Debug" build/android/maryou-ai-debug.apk
          test -s build/android/maryou-ai-debug.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euxo pipefail
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose build/android/maryou-ai-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maryou-ai-debug-apk
          path: build/android/maryou-ai-debug.apk
          if-no-files-found: error
