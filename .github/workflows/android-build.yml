name: Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK: "28.1.13356709"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}"

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/android"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install matching export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Validate Godot project and all GDScript
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/godot-validation.log"
          godot --headless --path . --editor --import --quit 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot project validation failed with exit code $godot_status."
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Could not find type|Identifier .* not declared|No loader found for resource|referenced non-existent resource' "$log_file"; then
            echo "Godot project validation found script/resource errors."
            exit 1
          fi

      - name: Run gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/smoke_test.gd

      - name: Export signed Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/godot-pre-export-validation.log"
          godot --headless --path . --editor --quit 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          if [ "$godot_status" -ne 0 ]; then
            echo "Refusing Android export because Godot project validation failed."
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Could not find type|Identifier .* not declared|No loader found for resource|referenced non-existent resource' "$log_file"; then
            echo "Refusing Android export because GDScript/resource validation failed."
            exit 1
          fi

          mkdir -p build/android
          godot --headless --path . --install-android-build-template --export-debug "Android Debug" build/android/maryou-ai-debug.apk
          test -s build/android/maryou-ai-debug.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euxo pipefail
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose build/android/maryou-ai-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maryou-ai-debug-apk
          path: build/android/maryou-ai-debug.apk
          if-no-files-found: error
